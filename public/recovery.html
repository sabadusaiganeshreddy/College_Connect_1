<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>College Connect Recovery</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }

      main {
        width: min(92vw, 560px);
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 32px;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 28px;
      }

      p {
        color: #475569;
        line-height: 1.6;
      }

      a {
        display: inline-block;
        margin-top: 16px;
        padding: 10px 16px;
        background: #4f46e5;
        color: white;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Recovery Has Moved</h1>
      <p>
        College Connect now writes through the Node.js API instead of direct browser database access.
        Data recovery should be handled by an authenticated backend workflow.
      </p>
      <a href="/">Return to College Connect</a>
    </main>
  </body>
</html>
